          example: 0
        message:
          type: string
          description: Empty for success; human-readable message for failure.
          example: ""
        data:
          nullable: true
          description: Endpoint-specific payload, or null for errors.
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              format: int32
              example: 100001
            message:
              type: string
              example: Request parameters are invalid.
            data:
              nullable: true
              example: null
