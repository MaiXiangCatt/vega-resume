    ResumeStatus:
      type: string
      enum:
        - draft
        - completed
    ResumeSort:
      type: string
      enum:
        - updated_desc
        - updated_asc
        - created_desc
        - title_asc
    ProfileAlignment:
      type: string
      enum:
        - left
        - center
        - right
    ResumeSummary:
      type: object
      required:
        - id
        - title
        - status
        - profileAlignment
        - templateId
        - revision
        - hasAvatar
        - hasSchoolLogo
        - exportCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 80
        status:
          $ref: "#/components/schemas/ResumeStatus"
        profileAlignment:
          $ref: "#/components/schemas/ProfileAlignment"
        revision:
          type: integer
          format: int64
          minimum: 1
        hasAvatar:
          type: boolean
        hasSchoolLogo:
          type: boolean
        templateId:
          type: string
          nullable: true
          deprecated: true
          description: Legacy projection. Left maps to modern-editorial, center to classic-professional, and right to null.
        exportCount:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResumeDetail:
      allOf:
        - $ref: "#/components/schemas/ResumeSummary"
        - type: object
          required:
            - contentVersion
            - content
          properties:
            contentVersion:
              type: integer
              enum: [2, 3, 4]
            content:
              $ref: "#/components/schemas/ResumeContent"
    ResumeStats:
      type: object
      required:
        - total
        - draft
        - completed
        - exported
      properties:
        total:
          type: integer
          minimum: 0
        draft:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        exported:
          type: integer
          format: int64
          minimum: 0
    ResumeListPayload:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResumeSummary"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          enum: [6, 12, 24]
        total:
          type: integer
          minimum: 0
    CreateResumeRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
    UpdateResumeRequest:
      type: object
      minProperties: 1
      required:
        - expectedRevision
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 80
        status:
          $ref: "#/components/schemas/ResumeStatus"
        profileAlignment:
          $ref: "#/components/schemas/ProfileAlignment"
        templateId:
          type: string
          nullable: true
          deprecated: true
          enum:
            - modern-editorial
            - classic-professional
        contentVersion:
          type: integer
          enum: [2, 3, 4]
        content:
          $ref: "#/components/schemas/ResumeContent"
    ImportResumeRequest:
      type: object
      required:
        - version
        - title
        - content
      properties:
        version:
          type: integer
          enum: [2, 3, 4]
        title:
          type: string
          minLength: 1
          maxLength: 80
        templateId:
          type: string
          nullable: true
          deprecated: true
          enum:
            - modern-editorial
            - classic-professional
        profileAlignment:
          $ref: "#/components/schemas/ProfileAlignment"
        avatar:
          type: string
          nullable: true
          maxLength: 750000
        schoolLogo:
          type: string
          nullable: true
          maxLength: 750000
        content:
          $ref: "#/components/schemas/ResumeContent"
    ResumeContent:
      type: object
      description: Serialized resume content must not exceed 512 KiB.
      required:
        - profile
        - sections
        - formatting
      additionalProperties: false
      properties:
        profile:
          type: object
          additionalProperties: true
          properties:
            enabled:
              type: boolean
              description: Required by content version 4. Controls whether the profile header is previewed and printed.
            politicalStatus:
              type: string
              maxLength: 320
              description: Optional political status displayed below the contact information.
        sections:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: true
        formatting:
          $ref: "#/components/schemas/ResumeFormatting"
    ResumeFormatting:
      type: object
      additionalProperties: false
      required:
        - nameFontSizePx
        - sectionTitleFontSizePx
        - entryTitleFontSizePx
        - bodyFontSizePx
        - lineHeightRatio
        - pageMarginPx
        - sectionGapPx
        - fontFamily
        - accentColor
      properties:
        nameFontSizePx:
          type: integer
          minimum: 12
          maximum: 48
        sectionTitleFontSizePx:
          type: integer
          minimum: 10
          maximum: 32
        entryTitleFontSizePx:
          type: integer
          minimum: 8
          maximum: 28
        bodyFontSizePx:
          type: integer
          minimum: 8
          maximum: 24
        lineHeightRatio:
          type: number
          minimum: 1
          maximum: 2.5
        pageMarginPx:
          type: object
          additionalProperties: false
          required:
            - top
            - right
            - bottom
            - left
          properties:
            top:
              type: integer
              minimum: 0
              maximum: 160
            right:
              type: integer
              minimum: 0
              maximum: 160
            bottom:
              type: integer
              minimum: 0
              maximum: 160
            left:
              type: integer
              minimum: 0
              maximum: 160
        sectionGapPx:
          type: integer
          minimum: 0
          maximum: 64
        entryGapPx:
          type: integer
          minimum: 0
          maximum: 64
        fontFamily:
          type: string
          enum:
            - source-han-sans
            - source-han-serif
        accentColor:
          type: string
          pattern: "^(plum|navy|teal|rust|charcoal|black|#[0-9A-Fa-f]{6})$"
    ResumeListResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              format: int32
              enum: [0]
            message:
              type: string
              enum: [""]
            data:
              $ref: "#/components/schemas/ResumeListPayload"
    ResumeDetailResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              format: int32
              enum: [0]
            message:
              type: string
              enum: [""]
            data:
              $ref: "#/components/schemas/ResumeDetail"
    ResumePrintPayload:
      type: object
      required:
        - resume
      properties:
        resume:
          $ref: "#/components/schemas/ResumeDetail"
        avatarDataUrl:
          type: string
          nullable: true
          description: Inline data URL of the avatar JPEG, if any.
        schoolLogoDataUrl:
          type: string
          nullable: true
          description: Inline data URL of the school logo PNG, if any.
    ResumePrintResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              format: int32
              enum: [0]
            message:
              type: string
              enum: [""]
            data:
              $ref: "#/components/schemas/ResumePrintPayload"
    ResumeStatsResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              format: int32
              enum: [0]
            message:
              type: string
              enum: [""]
            data:
              $ref: "#/components/schemas/ResumeStats"
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - confirmPassword
        - verificationCode
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Za-z0-9_\u4e00-\u9fa5-]+$'
          example: zhangsan
        email:
          type: string
          format: email
          maxLength: 254
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: password1
        confirmPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: password1
        verificationCode:
          type: string
          pattern: '^[0-9]{6}$'
          example: "083421"
        invitationCode:
          type: string
          maxLength: 64
          example: "ABCD-EFGH-JKLM-NPQR"
