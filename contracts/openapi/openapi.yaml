openapi: 3.0.3
info:
  title: LittleAgResume API
  version: 0.2.0
  description: Contract for authentication and resume management.
servers:
  - url: http://localhost:8080
paths:
  /api/auth/registration-policy:
    get:
      operationId: getAuthRegistrationPolicy
      tags:
        - Auth
      summary: Get the current registration mode and challenge availability
      responses:
        "200":
          description: Current registration policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPolicyResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/invitation-challenge:
    get:
      operationId: getAuthInvitationChallenge
      tags:
        - Auth
      summary: Get a random invitation challenge
      responses:
        "200":
          description: Random invitation challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationChallengeResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/invitation-challenge/answer:
    post:
      operationId: answerAuthInvitationChallenge
      tags:
        - Auth
      summary: Answer an invitation challenge and issue a short-lived invitation code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInvitationChallengeRequest"
      responses:
        "200":
          description: Short-lived invitation code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/register:
    post:
      operationId: registerAuthUser
      tags:
        - Auth
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Verified user created and session issued.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/registration-email-verification:
    post:
      operationId: sendAuthRegistrationEmailVerification
      tags:
        - Auth
      summary: Send or resend a registration email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRegistrationEmailVerificationRequest"
      responses:
        "200":
          description: Verification challenge is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerificationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/email-verification/confirm:
    post:
      operationId: confirmAuthEmailVerification
      tags:
        - Auth
      summary: Confirm a registration email verification code and issue a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailVerificationRequest"
      responses:
        "200":
          description: Email verified and user session issued.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/email-verification/resend:
    post:
      operationId: resendAuthEmailVerification
      tags:
        - Auth
      summary: Resend a verification code for a legacy unverified account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendEmailVerificationRequest"
      responses:
        "200":
          description: Verification challenge is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerificationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/login:
    post:
      operationId: loginAuthUser
      tags:
        - Auth
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged-in user and access token.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          description: ErrAccountLocked response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrAccountLocked:
                  value:
                    code: 101009
                    message: Account is temporarily locked.
                    data: null
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/me:
    get:
      operationId: getCurrentAuthUser
      tags:
        - Auth
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/refresh:
    post:
      operationId: refreshAuthSession
      tags:
        - Auth
      summary: Rotate refresh token and issue a new access token
      parameters:
        - $ref: "#/components/parameters/RefreshTokenCookie"
      responses:
        "200":
          description: Refreshed user session.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: ErrRefreshTokenInvalid response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ErrRefreshTokenInvalid:
                  value:
                    code: 101010
                    message: Refresh token is invalid.
                    data: null
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/logout:
    post:
      operationId: logoutAuthUser
      tags:
        - Auth
      summary: Revoke refresh token and clear cookie
      parameters:
        - $ref: "#/components/parameters/RefreshTokenCookie"
      responses:
        "200":
          description: Logged out. Clears refresh_token cookie.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshTokenSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/resumes:
    get:
      operationId: listResumes
      tags:
        - Resume
      summary: List the current user's resumes
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 80
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ResumeStatus"
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/ResumeSort"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            enum: [6, 12, 24]
            default: 6
      responses:
        "200":
          description: Paginated resume summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createResume
      tags:
        - Resume
      summary: Create a blank draft resume
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResumeRequest"
      responses:
        "200":
          description: Created resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/resumes/stats:
    get:
      operationId: getResumeStats
      tags:
        - Resume
      summary: Get resume statistics for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's aggregate resume statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeStatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/resumes/import:
    post:
      operationId: importResume
      tags:
        - Resume
      summary: Import a LittleAgResume envelope as a new draft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportResumeRequest"
      responses:
        "200":
          description: Imported resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/resumes/{resumeId}:
    parameters:
      - $ref: "#/components/parameters/ResumeId"
    get:
      operationId: getResume
      tags:
        - Resume
      summary: Get a resume owned by the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resume details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      operationId: updateResume
      tags:
        - Resume
      summary: Update resume metadata or opaque content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResumeRequest"
      responses:
        "200":
          description: Updated resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteResume
      tags:
        - Resume
      summary: Delete a resume owned by the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resume deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/resumes/{resumeId}/copy:
    parameters:
      - $ref: "#/components/parameters/ResumeId"
    post:
      operationId: copyResume
      tags:
        - Resume
      summary: Copy a resume as a new draft
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Copied resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/resumes/{resumeId}/import:
    parameters:
      - $ref: "#/components/parameters/ResumeId"
    put:
      operationId: replaceResumeImport
      tags:
        - Resume
      summary: Replace an existing resume from a LittleAgResume envelope
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ImportResumeRequest"
                - type: object
                  required:
                    - expectedRevision
                  properties:
                    expectedRevision:
                      type: integer
                      format: int64
                      minimum: 1
      responses:
        "200":
          description: Replaced resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/resumes/{resumeId}/export/pdf:
    parameters:
      - $ref: "#/components/parameters/ResumeId"
    post:
      operationId: exportResumePdf
      tags:
        - Resume
      summary: Render the resume to a PDF via headless Chrome; records the export on success
      security:
        - bearerAuth: []
      responses:
        "200":
          description: PDF bytes.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/resumes/{resumeId}/print:
    parameters:
      - $ref: "#/components/parameters/ResumeId"
    get:
      operationId: getResumePrintData
      tags:
        - Resume
      summary: Print-page data endpoint authorized by a short-lived print token
      parameters:
        - name: X-Print-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resume detail plus inline avatar for printing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumePrintResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/resumes/{resumeId}/avatar:
    parameters:
      - $ref: "#/components/parameters/ResumeId"
    get:
      operationId: getResumeAvatar
      tags:
        - Resume
      summary: Get the current resume avatar
      security:
        - bearerAuth: []
      responses:
        "200":
          description: JPEG avatar bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putResumeAvatar
      tags:
        - Resume
      summary: Replace the current resume avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: A 500×700 JPEG portrait cropped to the standard 5:7 one-inch-photo ratio.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Updated resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteResumeAvatar
      tags:
        - Resume
      summary: Delete the current resume avatar
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/resumes/{resumeId}/school-logo:
    parameters:
      - $ref: "#/components/parameters/ResumeId"
    get:
      operationId: getResumeSchoolLogo
      tags:
        - Resume
      summary: Get the current resume school logo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: PNG school logo bytes.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putResumeSchoolLogo
      tags:
        - Resume
      summary: Replace the current resume school logo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: A 500×500 PNG school logo cropped to a square while preserving transparency.
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Updated resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteResumeSchoolLogo
      tags:
        - Resume
      summary: Delete the current resume school logo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/analytics/config:
    get:
      operationId: getAnalyticsConfig
      tags:
        - Analytics
      summary: Get anonymous analytics availability and consent version
      responses:
        "200":
          description: Current anonymous analytics configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsConfig"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/analytics/events:
    post:
      operationId: postAnalyticsEvent
      tags:
        - Analytics
      summary: Accept one anonymous product milestone event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventRequest"
      responses:
        "202":
          description: Event accepted, already recorded, or silently discarded by installation quota.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/analytics/deletions:
    post:
      operationId: deleteAnalyticsInstallation
      tags:
        - Analytics
      summary: Delete anonymous installation detail without revealing whether it existed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsDeletionRequest"
      responses:
        "202":
          description: Deletion completed or the installation did not exist.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ResumeId:
      name: resumeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: false
      description: HttpOnly refresh token cookie.
      schema:
        type: string
  headers:
    RefreshTokenSetCookie:
      description: HttpOnly refresh_token cookie scoped to authentication endpoints.
      schema:
        type: string
        example: refresh_token=opaque; Path=/api/auth; Max-Age=604800; HttpOnly; SameSite=Lax
    ClearRefreshTokenSetCookie:
      description: Expired refresh_token cookie.
      schema:
        type: string
        example: refresh_token=; Path=/api/auth; Max-Age=0; HttpOnly; SameSite=Lax
  responses:
    NotFound:
      description: Requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request, including ErrUsernameFormatInvalid and validation errors.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            ErrUsernameFormatInvalid:
              value:
                code: 101008
                message: Username format is invalid.
                data: null
    Unauthorized:
      description: Authentication failed, token missing, token expired, or token invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            ErrTokenExpired:
              value:
                code: 101003
                message: Token expired.
                data: null
            ErrTokenInvalid:
              value:
                code: 101004
                message: Token invalid.
                data: null
    Forbidden:
      description: The authenticated identity cannot perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate email or username, including ErrUsernameExists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            ErrUsernameExists:
              value:
                code: 101007
                message: Username already exists.
                data: null
    TooManyRequests:
      description: ErrTooManyRequests response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            ErrTooManyRequests:
              value:
                code: 100006
                message: Too many requests.
                data: null
    InternalServerError:
      description: Server error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required backend resource is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    BaseResponse:
